<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Defesa contra Ataques Virtuais</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <!-- Cabeçalho com título e barra de integridade -->
        <header class="cabecalho">
            <h1>🛡️ Defesa contra Ataques Virtuais</h1>
            <p class="subtitulo">Você é o responsável pela segurança da rede. Tome decisões com cuidado!</p>
            <p class="subtitulo" id="contador-etapas">Etapa 1 · Caminho de investigação</p>

            <div class="barra-container">
                <div class="barra-label">
                    <span>Integridade da Rede</span>
                    <span id="valor-integridade">100%</span>
                </div>
                <div class="barra-fundo">
                    <div id="barra-integridade" class="barra-preenchimento"></div>
                </div>
            </div>
        </header>

        <!-- Área principal onde as cenas aparecem -->
        <main class="cena" id="cena">
            <!-- O conteúdo é gerado pelo JavaScript -->
        </main>

        <!-- Rodapé com créditos -->
        <footer class="rodape">
            <h3>CRÉDITOS</h3>
            <p class="turma">Turma: <strong>3i</strong></p>
            <ol class="lista-integrantes">
                <li>
                    <span class="bolinha">12</span>
                    Gabriela Govaski de Nascimento
                </li>
                <li>
                    <span class="bolinha">28</span>
                    Mateus Henrique Kotryk de Souza
                </li>
            </ol>
        </footer>

    </div>

    <script src="script.js"></script>
</body>
</html>
